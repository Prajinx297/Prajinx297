<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <style>
    /* Stickman travels across bar tops, climbing and descending */
    .stickman { animation: travel 10s linear infinite; }

    /* Arm swing — pivot at shoulder (0, -23) */
    .arm-l { transform-origin: 0px -23px; animation: swingA 0.38s ease-in-out infinite alternate; }
    .arm-r { transform-origin: 0px -23px; animation: swingB 0.38s ease-in-out infinite alternate; }

    /* Leg swing — pivot at hip (0, -11) */
    .leg-l { transform-origin: 0px -11px; animation: swingB 0.38s ease-in-out infinite alternate; }
    .leg-r { transform-origin: 0px -11px; animation: swingA 0.38s ease-in-out infinite alternate; }

    /*
     * Stickman origin = feet (y=0). Ground = y=210. Bars grow upward.
     * 25 bars, 32px slots (28px bar + 4px gap). Bar center x = slot*32 + 16.
     * translate(cx, bar_top) places feet exactly on the bar surface.
     *
     * Left→right: 0%–48% (2% per bar, 25 bars)
     * Pause + flip at right end: 48%–50%
     * Right→left: 50%–98% (reverse)
     * Pause + unflip at left end: 98%–100%
     */
    @keyframes travel {
      /* ── Left → Right ─────────────────────────────────────────── */
      0%  { transform: translate(16px,  185px) scaleX(1);  }
      2%  { transform: translate(48px,  165px) scaleX(1);  }
      4%  { transform: translate(80px,  140px) scaleX(1);  }
      6%  { transform: translate(112px, 155px) scaleX(1);  }
      8%  { transform: translate(144px, 175px) scaleX(1);  }
      10% { transform: translate(176px, 130px) scaleX(1);  }
      12% { transform: translate(208px, 100px) scaleX(1);  }
      14% { transform: translate(240px, 115px) scaleX(1);  }
      16% { transform: translate(272px, 145px) scaleX(1);  }
      18% { transform: translate(304px, 165px) scaleX(1);  }
      20% { transform: translate(336px, 180px) scaleX(1);  }
      22% { transform: translate(368px, 155px) scaleX(1);  }
      24% { transform: translate(400px, 110px) scaleX(1);  }
      26% { transform: translate(432px,  75px) scaleX(1);  }
      28% { transform: translate(464px,  90px) scaleX(1);  }
      30% { transform: translate(496px, 125px) scaleX(1);  }
      32% { transform: translate(528px, 150px) scaleX(1);  }
      34% { transform: translate(560px, 135px) scaleX(1);  }
      36% { transform: translate(592px, 105px) scaleX(1);  }
      38% { transform: translate(624px,  80px) scaleX(1);  }
      40% { transform: translate(656px, 100px) scaleX(1);  }
      42% { transform: translate(688px, 135px) scaleX(1);  }
      44% { transform: translate(720px, 160px) scaleX(1);  }
      46% { transform: translate(752px, 145px) scaleX(1);  }
      48% { transform: translate(784px, 175px) scaleX(1);  }
      /* ── Pause + flip at right end ────────────────────────────── */
      50% { transform: translate(784px, 175px) scaleX(-1); }
      /* ── Right → Left ─────────────────────────────────────────── */
      52% { transform: translate(752px, 145px) scaleX(-1); }
      54% { transform: translate(720px, 160px) scaleX(-1); }
      56% { transform: translate(688px, 135px) scaleX(-1); }
      58% { transform: translate(656px, 100px) scaleX(-1); }
      60% { transform: translate(624px,  80px) scaleX(-1); }
      62% { transform: translate(592px, 105px) scaleX(-1); }
      64% { transform: translate(560px, 135px) scaleX(-1); }
      66% { transform: translate(528px, 150px) scaleX(-1); }
      68% { transform: translate(496px, 125px) scaleX(-1); }
      70% { transform: translate(464px,  90px) scaleX(-1); }
      72% { transform: translate(432px,  75px) scaleX(-1); }
      74% { transform: translate(400px, 110px) scaleX(-1); }
      76% { transform: translate(368px, 155px) scaleX(-1); }
      78% { transform: translate(336px, 180px) scaleX(-1); }
      80% { transform: translate(304px, 165px) scaleX(-1); }
      82% { transform: translate(272px, 145px) scaleX(-1); }
      84% { transform: translate(240px, 115px) scaleX(-1); }
      86% { transform: translate(208px, 100px) scaleX(-1); }
      88% { transform: translate(176px, 130px) scaleX(-1); }
      90% { transform: translate(144px, 175px) scaleX(-1); }
      92% { transform: translate(112px, 155px) scaleX(-1); }
      94% { transform: translate(80px,  140px) scaleX(-1); }
      96% { transform: translate(48px,  165px) scaleX(-1); }
      98% { transform: translate(16px,  185px) scaleX(-1); }
      /* ── Pause + unflip at left end ───────────────────────────── */
      100% { transform: translate(16px, 185px) scaleX(1);  }
    }

    @keyframes swingA { from { transform: rotate(-25deg); } to { transform: rotate(25deg);  } }
    @keyframes swingB { from { transform: rotate(25deg);  } to { transform: rotate(-25deg); } }
  </style>

  <!-- Dark background -->
  <rect width="800" height="220" fill="#0d1117" rx="6"/>

  <!-- Subtle horizontal grid lines -->
  <line x1="0" y1="160" x2="800" y2="160" stroke="#161b22" stroke-width="1"/>
  <line x1="0" y1="130" x2="800" y2="130" stroke="#161b22" stroke-width="1"/>
  <line x1="0" y1="100" x2="800" y2="100" stroke="#161b22" stroke-width="1"/>
  <line x1="0" y1="70"  x2="800" y2="70"  stroke="#161b22" stroke-width="1"/>

  <!-- Contribution bars (28 px wide, 4 px gap, 32 px slot; ground = y 210) -->
  <!-- Color key: h<40 → #0e4429 | 40–69 → #006d32 | 70–99 → #26a641 | 100+ → #39d353 -->
  <rect x="2"   y="185" width="28" height="25"  rx="2" fill="#0e4429"/><!-- h=25 -->
  <rect x="34"  y="165" width="28" height="45"  rx="2" fill="#006d32"/><!-- h=45 -->
  <rect x="66"  y="140" width="28" height="70"  rx="2" fill="#26a641"/><!-- h=70 -->
  <rect x="98"  y="155" width="28" height="55"  rx="2" fill="#006d32"/><!-- h=55 -->
  <rect x="130" y="175" width="28" height="35"  rx="2" fill="#0e4429"/><!-- h=35 -->
  <rect x="162" y="130" width="28" height="80"  rx="2" fill="#26a641"/><!-- h=80 -->
  <rect x="194" y="100" width="28" height="110" rx="2" fill="#39d353"/><!-- h=110 -->
  <rect x="226" y="115" width="28" height="95"  rx="2" fill="#26a641"/><!-- h=95 -->
  <rect x="258" y="145" width="28" height="65"  rx="2" fill="#006d32"/><!-- h=65 -->
  <rect x="290" y="165" width="28" height="45"  rx="2" fill="#006d32"/><!-- h=45 -->
  <rect x="322" y="180" width="28" height="30"  rx="2" fill="#0e4429"/><!-- h=30 -->
  <rect x="354" y="155" width="28" height="55"  rx="2" fill="#006d32"/><!-- h=55 -->
  <rect x="386" y="110" width="28" height="100" rx="2" fill="#39d353"/><!-- h=100 -->
  <rect x="418" y="75"  width="28" height="135" rx="2" fill="#39d353"/><!-- h=135 -->
  <rect x="450" y="90"  width="28" height="120" rx="2" fill="#39d353"/><!-- h=120 -->
  <rect x="482" y="125" width="28" height="85"  rx="2" fill="#26a641"/><!-- h=85 -->
  <rect x="514" y="150" width="28" height="60"  rx="2" fill="#006d32"/><!-- h=60 -->
  <rect x="546" y="135" width="28" height="75"  rx="2" fill="#26a641"/><!-- h=75 -->
  <rect x="578" y="105" width="28" height="105" rx="2" fill="#39d353"/><!-- h=105 -->
  <rect x="610" y="80"  width="28" height="130" rx="2" fill="#39d353"/><!-- h=130 -->
  <rect x="642" y="100" width="28" height="110" rx="2" fill="#39d353"/><!-- h=110 -->
  <rect x="674" y="135" width="28" height="75"  rx="2" fill="#26a641"/><!-- h=75 -->
  <rect x="706" y="160" width="28" height="50"  rx="2" fill="#006d32"/><!-- h=50 -->
  <rect x="738" y="145" width="28" height="65"  rx="2" fill="#006d32"/><!-- h=65 -->
  <rect x="770" y="175" width="28" height="35"  rx="2" fill="#0e4429"/><!-- h=35 -->

  <!-- Ground line -->
  <line x1="0" y1="210" x2="800" y2="210" stroke="#21262d" stroke-width="1"/>

  <!-- Stickman — origin at feet (0, 0); body drawn upward in negative-y -->
  <g class="stickman">
    <!-- Head -->
    <circle cx="0" cy="-35" r="6" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <!-- Body -->
    <line x1="0" y1="-29" x2="0" y2="-11"
          stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    <!-- Left arm -->
    <g class="arm-l">
      <line x1="0" y1="-23" x2="-11" y2="-14"
            stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Right arm -->
    <g class="arm-r">
      <line x1="0" y1="-23" x2="11" y2="-14"
            stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Left leg -->
    <g class="leg-l">
      <line x1="0" y1="-11" x2="-9" y2="0"
            stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Right leg -->
    <g class="leg-r">
      <line x1="0" y1="-11" x2="9" y2="0"
            stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
