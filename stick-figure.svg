<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <style>
    /*
     * Stickman origin = feet (0,0). CSS applies transforms right-to-left:
     *   rotate(r) → scaleX(s) → translate(x,y)
     * So the body rotates around its own feet, then is placed at (x,y).
     *
     * rotate() encodes slope steepness:
     *   steep up   (Δy < -30)  →  -40 deg  (body leans hard into slope)
     *   moderate up             →  -28 deg
     *   slight up               →  -18 deg
     *   downhill / flat         →  +8..+10 deg  (upright / slight forward lean)
     *
     * scaleX(-1) mirrors the lean automatically, so the same negative angle
     * means "lean forward" for both the L→R and R→L passes.
     */
    .stickman { animation: travel 10s linear infinite; }

    /* Shoulder pivot — arm swings forward-biased so that when body is tilted
       the arms naturally reach UP the slope (climbing), and when upright they
       do a normal walking swing. */
    .arm-l { transform-origin: 0px -23px; animation: swingA 0.30s ease-in-out infinite alternate; }
    .arm-r { transform-origin: 0px -23px; animation: swingB 0.30s ease-in-out infinite alternate; }

    /* Hip pivot — legs push behind more for climbing thrust */
    .leg-l { transform-origin: 0px -11px; animation: swingB 0.30s ease-in-out infinite alternate; }
    .leg-r { transform-origin: 0px -11px; animation: swingA 0.30s ease-in-out infinite alternate; }

    @keyframes travel {
      /* ── Left → Right ─── slope comment: Δy of (next_bar_top − cur_bar_top) ── */
      0%  { transform: translate(16px,  185px) scaleX(1)  rotate(-22deg); } /* UP   -20 */
      2%  { transform: translate(48px,  165px) scaleX(1)  rotate(-30deg); } /* UP   -25 */
      4%  { transform: translate(80px,  140px) scaleX(1)  rotate(8deg);   } /* DOWN +15 */
      6%  { transform: translate(112px, 155px) scaleX(1)  rotate(8deg);   } /* DOWN +20 */
      8%  { transform: translate(144px, 175px) scaleX(1)  rotate(-40deg); } /* UP   -45 steep */
      10% { transform: translate(176px, 130px) scaleX(1)  rotate(-30deg); } /* UP   -30 */
      12% { transform: translate(208px, 100px) scaleX(1)  rotate(8deg);   } /* DOWN +15 */
      14% { transform: translate(240px, 115px) scaleX(1)  rotate(10deg);  } /* DOWN +30 */
      16% { transform: translate(272px, 145px) scaleX(1)  rotate(8deg);   } /* DOWN +20 */
      18% { transform: translate(304px, 165px) scaleX(1)  rotate(8deg);   } /* DOWN +15 */
      20% { transform: translate(336px, 180px) scaleX(1)  rotate(-30deg); } /* UP   -25 */
      22% { transform: translate(368px, 155px) scaleX(1)  rotate(-40deg); } /* UP   -45 steep */
      24% { transform: translate(400px, 110px) scaleX(1)  rotate(-38deg); } /* UP   -35 steep */
      26% { transform: translate(432px,  75px) scaleX(1)  rotate(8deg);   } /* DOWN +15 */
      28% { transform: translate(464px,  90px) scaleX(1)  rotate(10deg);  } /* DOWN +35 */
      30% { transform: translate(496px, 125px) scaleX(1)  rotate(8deg);   } /* DOWN +25 */
      32% { transform: translate(528px, 150px) scaleX(1)  rotate(-18deg); } /* UP   -15 slight */
      34% { transform: translate(560px, 135px) scaleX(1)  rotate(-30deg); } /* UP   -30 */
      36% { transform: translate(592px, 105px) scaleX(1)  rotate(-28deg); } /* UP   -25 */
      38% { transform: translate(624px,  80px) scaleX(1)  rotate(8deg);   } /* DOWN +20 */
      40% { transform: translate(656px, 100px) scaleX(1)  rotate(10deg);  } /* DOWN +35 */
      42% { transform: translate(688px, 135px) scaleX(1)  rotate(8deg);   } /* DOWN +25 */
      44% { transform: translate(720px, 160px) scaleX(1)  rotate(-18deg); } /* UP   -15 slight */
      46% { transform: translate(752px, 145px) scaleX(1)  rotate(10deg);  } /* DOWN +30 */
      48% { transform: translate(784px, 175px) scaleX(1)  rotate(0deg);   } /* end L→R */
      /* ── Flip at right end ──────────────────────────────────────────── */
      50% { transform: translate(784px, 175px) scaleX(-1) rotate(0deg);   }
      /* ── Right → Left ─── same rotate sign works: scaleX(-1) mirrors lean ── */
      52% { transform: translate(752px, 145px) scaleX(-1) rotate(-30deg); } /* UP   -30 */
      54% { transform: translate(720px, 160px) scaleX(-1) rotate(8deg);   } /* DOWN +15 */
      56% { transform: translate(688px, 135px) scaleX(-1) rotate(-28deg); } /* UP   -25 */
      58% { transform: translate(656px, 100px) scaleX(-1) rotate(-38deg); } /* UP   -35 steep */
      60% { transform: translate(624px,  80px) scaleX(-1) rotate(-22deg); } /* UP   -20 */
      62% { transform: translate(592px, 105px) scaleX(-1) rotate(8deg);   } /* DOWN +25 */
      64% { transform: translate(560px, 135px) scaleX(-1) rotate(10deg);  } /* DOWN +30 */
      66% { transform: translate(528px, 150px) scaleX(-1) rotate(8deg);   } /* DOWN +15 */
      68% { transform: translate(496px, 125px) scaleX(-1) rotate(-28deg); } /* UP   -25 */
      70% { transform: translate(464px,  90px) scaleX(-1) rotate(-38deg); } /* UP   -35 steep */
      72% { transform: translate(432px,  75px) scaleX(-1) rotate(-18deg); } /* UP   -15 slight */
      74% { transform: translate(400px, 110px) scaleX(-1) rotate(10deg);  } /* DOWN +35 */
      76% { transform: translate(368px, 155px) scaleX(-1) rotate(10deg);  } /* DOWN +45 */
      78% { transform: translate(336px, 180px) scaleX(-1) rotate(8deg);   } /* DOWN +25 */
      80% { transform: translate(304px, 165px) scaleX(-1) rotate(-18deg); } /* UP   -15 slight */
      82% { transform: translate(272px, 145px) scaleX(-1) rotate(-22deg); } /* UP   -20 */
      84% { transform: translate(240px, 115px) scaleX(-1) rotate(-30deg); } /* UP   -30 */
      86% { transform: translate(208px, 100px) scaleX(-1) rotate(-18deg); } /* UP   -15 slight */
      88% { transform: translate(176px, 130px) scaleX(-1) rotate(10deg);  } /* DOWN +30 */
      90% { transform: translate(144px, 175px) scaleX(-1) rotate(10deg);  } /* DOWN +45 */
      92% { transform: translate(112px, 155px) scaleX(-1) rotate(-22deg); } /* UP   -20 */
      94% { transform: translate(80px,  140px) scaleX(-1) rotate(-18deg); } /* UP   -15 slight */
      96% { transform: translate(48px,  165px) scaleX(-1) rotate(8deg);   } /* DOWN +25 */
      98% { transform: translate(16px,  185px) scaleX(-1) rotate(8deg);   } /* DOWN +20 */
      /* ── Flip back at left end ──────────────────────────────────────── */
      100% { transform: translate(16px, 185px) scaleX(1)  rotate(-22deg); }
    }

    /*
     * Arm/leg swing is forward-biased (-42 to +18, centre ≈ -12 deg).
     * When body is tilted -38 deg (steep climb):
     *   reaching arm = -42 - 38 = -80 deg from world-vertical → nearly horizontal upward ✓
     *   pushing arm  = +18 - 38 = -20 deg → still forward ✓  (all-4-limbs climbing look)
     * When body is upright (+8 deg, walking down):
     *   forward arm  = -42 + 8 = -34 deg
     *   back arm     = +18 + 8 = +26 deg → normal walking swing ✓
     */
    @keyframes swingA { from { transform: rotate(-42deg); } to { transform: rotate(18deg);  } }
    @keyframes swingB { from { transform: rotate(18deg);  } to { transform: rotate(-42deg); } }
  </style>

  <!-- Dark background -->
  <rect width="800" height="220" fill="#0d1117" rx="6"/>

  <!-- Subtle horizontal grid lines -->
  <line x1="0" y1="160" x2="800" y2="160" stroke="#161b22" stroke-width="1"/>
  <line x1="0" y1="130" x2="800" y2="130" stroke="#161b22" stroke-width="1"/>
  <line x1="0" y1="100" x2="800" y2="100" stroke="#161b22" stroke-width="1"/>
  <line x1="0" y1="70"  x2="800" y2="70"  stroke="#161b22" stroke-width="1"/>

  <!-- Contribution bars (28 px wide, 4 px gap, 32 px slot; ground = y 210) -->
  <!-- Color key: h<40 → #0e4429 | 40–69 → #006d32 | 70–99 → #26a641 | 100+ → #39d353 -->
  <rect x="2"   y="185" width="28" height="25"  rx="2" fill="#0e4429"/><!-- h=25 -->
  <rect x="34"  y="165" width="28" height="45"  rx="2" fill="#006d32"/><!-- h=45 -->
  <rect x="66"  y="140" width="28" height="70"  rx="2" fill="#26a641"/><!-- h=70 -->
  <rect x="98"  y="155" width="28" height="55"  rx="2" fill="#006d32"/><!-- h=55 -->
  <rect x="130" y="175" width="28" height="35"  rx="2" fill="#0e4429"/><!-- h=35 -->
  <rect x="162" y="130" width="28" height="80"  rx="2" fill="#26a641"/><!-- h=80 -->
  <rect x="194" y="100" width="28" height="110" rx="2" fill="#39d353"/><!-- h=110 -->
  <rect x="226" y="115" width="28" height="95"  rx="2" fill="#26a641"/><!-- h=95 -->
  <rect x="258" y="145" width="28" height="65"  rx="2" fill="#006d32"/><!-- h=65 -->
  <rect x="290" y="165" width="28" height="45"  rx="2" fill="#006d32"/><!-- h=45 -->
  <rect x="322" y="180" width="28" height="30"  rx="2" fill="#0e4429"/><!-- h=30 -->
  <rect x="354" y="155" width="28" height="55"  rx="2" fill="#006d32"/><!-- h=55 -->
  <rect x="386" y="110" width="28" height="100" rx="2" fill="#39d353"/><!-- h=100 -->
  <rect x="418" y="75"  width="28" height="135" rx="2" fill="#39d353"/><!-- h=135 -->
  <rect x="450" y="90"  width="28" height="120" rx="2" fill="#39d353"/><!-- h=120 -->
  <rect x="482" y="125" width="28" height="85"  rx="2" fill="#26a641"/><!-- h=85 -->
  <rect x="514" y="150" width="28" height="60"  rx="2" fill="#006d32"/><!-- h=60 -->
  <rect x="546" y="135" width="28" height="75"  rx="2" fill="#26a641"/><!-- h=75 -->
  <rect x="578" y="105" width="28" height="105" rx="2" fill="#39d353"/><!-- h=105 -->
  <rect x="610" y="80"  width="28" height="130" rx="2" fill="#39d353"/><!-- h=130 -->
  <rect x="642" y="100" width="28" height="110" rx="2" fill="#39d353"/><!-- h=110 -->
  <rect x="674" y="135" width="28" height="75"  rx="2" fill="#26a641"/><!-- h=75 -->
  <rect x="706" y="160" width="28" height="50"  rx="2" fill="#006d32"/><!-- h=50 -->
  <rect x="738" y="145" width="28" height="65"  rx="2" fill="#006d32"/><!-- h=65 -->
  <rect x="770" y="175" width="28" height="35"  rx="2" fill="#0e4429"/><!-- h=35 -->

  <!-- Ground line -->
  <line x1="0" y1="210" x2="800" y2="210" stroke="#21262d" stroke-width="1"/>

  <!-- Stickman — origin at feet (0, 0); body drawn upward in negative-y -->
  <g class="stickman">
    <!-- Head -->
    <circle cx="0" cy="-35" r="6" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <!-- Body -->
    <line x1="0" y1="-29" x2="0" y2="-11"
          stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    <!-- Left arm -->
    <g class="arm-l">
      <line x1="0" y1="-23" x2="-11" y2="-14"
            stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Right arm -->
    <g class="arm-r">
      <line x1="0" y1="-23" x2="11" y2="-14"
            stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Left leg -->
    <g class="leg-l">
      <line x1="0" y1="-11" x2="-9" y2="0"
            stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Right leg -->
    <g class="leg-r">
      <line x1="0" y1="-11" x2="9" y2="0"
            stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
